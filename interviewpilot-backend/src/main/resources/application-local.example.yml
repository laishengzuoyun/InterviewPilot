spring:
  datasource:
    url: jdbc:mysql://localhost:3306/interviewpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: your-local-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver

interviewpilot:
  upload:
    base-dir: uploads
    max-file-size: 10MB
    max-request-size: 20MB

ai:
  provider: mimo
  mimo:
    api-key: your-mimo-api-key
    base-url: your-mimo-base-url
    model: your-mimo-model
