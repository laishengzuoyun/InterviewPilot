server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: interviewpilot-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interviewpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20MB}

interviewpilot:
  upload:
    base-dir: ${UPLOAD_BASE_DIR:uploads}
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
    max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20MB}

ai:
  provider: ${AI_PROVIDER:mimo}
  mimo:
    api-key: ${MIMO_API_KEY:}
    base-url: ${MIMO_BASE_URL:}
    model: ${MIMO_MODEL:}
